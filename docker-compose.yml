# Mesmo layout do servidor interno, construído a partir das pastas deste repositório:
#   http://<máquina>/                    → Letramento em IA Hemobrás (construído do GitHub)
#   http://<máquina>/sistemadereunioes/  → Sistema de Apoio a Reuniões (frontend/ + backend/ + MySQL)
#
# Uso (nesta pasta):
#   cp .env.example .env   (e preencha as senhas)
#   docker compose up -d --build
# Só o gateway fica exposto, na PORTA do .env (padrão 80).
#
# servidor/docker-compose.yml faz o mesmo, mas constrói este sistema direto do GitHub
# (sem precisar do repositório clonado). Use um OU outro: os nomes dos contêineres são os mesmos.
services:
  gateway:
    image: nginx:1.27.3-alpine
    container_name: gateway
    ports:
      - "${PORTA:-80}:80"
    volumes:
      - ./servidor/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - letramento
      - reunioes
    restart: unless-stopped

  letramento:
    build:
      context: ${LETRAMENTO_REPO:-https://github.com/MarcoAurello/letramentoEmIAHemobras.git#main}
      # O repositório do letramento não tem Dockerfile: os arquivos que o site usa vão para um Nginx.
      # Se o site ganhar arquivos novos, acrescente-os aqui e em servidor/docker-compose.yml.
      dockerfile_inline: |
        FROM nginx:1.27.3-alpine
        RUN printf 'server {\n listen 80;\n root /usr/share/nginx/html;\n index index.html;\n server_tokens off;\n absolute_redirect off;\n location ~ /\\. { deny all; }\n location / { add_header Cache-Control "no-cache" always; try_files $$uri $$uri/ =404; }\n}\n' > /etc/nginx/conf.d/default.conf
        COPY index.html formulario-hemobras.html *.pdf pessoas.xlsx /usr/share/nginx/html/
    image: letramento:latest
    container_name: letramento
    restart: unless-stopped

  reunioes:
    build: ./frontend
    image: sistema-reunioes:latest
    container_name: sistema-reunioes
    depends_on:
      - reunioes-api
    restart: unless-stopped

  reunioes-api:
    build: ./backend
    image: sistema-reunioes-api:latest
    container_name: reunioes-api
    environment:
      DB_HOST: reunioes-db
      DB_NAME: reunioes
      DB_USER: reunioes
      DB_PASS: ${DB_PASS:?defina DB_PASS no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-6h}
      SENHA_ADMIN: ${SENHA_ADMIN:-}
      SENHA_LEITURA: ${SENHA_LEITURA:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELO: ${GEMINI_MODELO:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELO: ${GROQ_MODELO:-}
      IA_PRINCIPAL: ${IA_PRINCIPAL:-}
    volumes:
      # Documentos anexados às entregas
      - reunioes-anexos:/app/src/uploads
    depends_on:
      reunioes-db:
        condition: service_healthy
    restart: unless-stopped

  reunioes-db:
    image: mysql:8.4.3
    container_name: reunioes-db
    environment:
      MYSQL_DATABASE: reunioes
      MYSQL_USER: reunioes
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?defina DB_ROOT_PASS no .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - reunioes-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 30
    restart: unless-stopped

volumes:
  reunioes-mysql:
  reunioes-anexos:
