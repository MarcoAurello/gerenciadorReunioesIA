# Gateway: recebe todos os acessos e encaminha para o sistema certo.
server {
    listen 80;
    server_name _;
    server_tokens off;
    # Redirecionamentos relativos: funcionam em qualquer porta ou nome do servidor
    absolute_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sistema de Apoio a Reuniões. A barra no fim do proxy_pass tira o prefixo:
    # /sistemadereunioes/app.js chega ao contêiner como /app.js
    location = /sistemadereunioes {
        return 301 /sistemadereunioes/$is_args$args;
    }
    location /sistemadereunioes/ {
        proxy_pass http://reunioes/;
        # Documentos de até 10 MB nas entregas; a IA pode levar quase um minuto
        client_max_body_size 11m;
        proxy_read_timeout 120s;
        # Redirecionamentos do contêiner ("/docs/") ganham o prefixo de volta
        proxy_redirect / /sistemadereunioes/;
    }

    # Letramento em IA, na raiz
    location / {
        proxy_pass http://letramento;
    }
}
