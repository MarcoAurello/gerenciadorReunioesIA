# Cabeçalhos de segurança, incluídos em cada location (no Nginx, um add_header
# dentro de location descarta os do nível de cima).
#
# CSP: a página só fala com o próprio servidor, com o Apps Script (a API, que
# redireciona para script.googleusercontent.com) e com o Google Fonts.
# Se o endereço da API mudar de domínio, ajuste o connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
