server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    # Redirecionamentos relativos: funcionam atrás do gateway, em /sistemadereunioes/
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Arquivos ocultos (.git, .env...) nunca são servidos
    location ~ /\. {
        deny all;
    }

    # API: repassada ao contêiner do backend. ^~ impede que as regras de extensão abaixo
    # capturem alguma rota da API. O nome "reunioes-api" é resolvido a cada requisição (resolver do
    # Docker), então o frontend sobe mesmo se o backend ainda não estiver no ar.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://reunioes-api:3333;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Anexos de até 10 MB; a IA pode levar quase um minuto para responder
        client_max_body_size 11m;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/seguranca.conf;
    }

    # HTML, JS e CSS: o navegador sempre confere se há versão nova,
    # então ninguém precisa de Ctrl+F5 depois de uma publicação
    location ~* \.(?:html|js|css)$ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Imagens mudam pouco: guardadas por 1 dia
    location ~* \.(?:svg|png|ico)$ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
