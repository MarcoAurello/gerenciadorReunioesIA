server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    # Redirecionamentos relativos: funcionam atrás do gateway, em /sistemadereunioes/
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Arquivos ocultos (.git, .env...) nunca são servidos
    location ~ /\. {
        deny all;
    }

    # HTML, JS e CSS: o navegador sempre confere se há versão nova,
    # então ninguém precisa de Ctrl+F5 depois de uma publicação
    location ~* \.(?:html|js|css)$ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Imagens mudam pouco: guardadas por 1 dia
    location ~* \.(?:svg|png|ico)$ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
